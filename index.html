<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会社員と出会う場・ダッシュボード</title>
<style>
  :root{--bg:#f4f5f7;--card:#ffffff;--line:#e2e5ea;--txt:#1f2430;--sub:#667085;--accent:#2563eb;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5}
  header{padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:12px;margin-bottom:8px}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .filters button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .filters.st button.on{background:#16a34a;border-color:#16a34a}
  .filters.dt button.on{background:#7c3aed;border-color:#7c3aed}
  .filters.dt .dtin{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--txt);cursor:pointer}
  .filters.dt .dtin.on{background:#7c3aed;border-color:#7c3aed;color:#fff;font-weight:700}
  .wrap{padding:12px 16px 60px;max-width:760px;margin:0 auto}
  .sec{margin:18px 0 6px;font-size:13px;color:var(--sub);letter-spacing:.04em;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .card.l3{border-left-color:#ef4444}.card.l2{border-left-color:#f59e0b}.card.l1{border-left-color:#10b981}
  .card.st-go{background:#e8f6ed}.card.st-maybe{background:#fdf4e1}.card.st-done{opacity:.5}
  .card.st-done .nm{text-decoration:line-through}
  .date{font-weight:800;font-size:15px;min-width:78px}
  .date small{display:block;color:var(--sub);font-size:11px;font-weight:500}
  .main{flex:1 1 220px;min-width:200px}
  .nm{font-weight:700;font-size:15px}
  .meta{color:var(--sub);font-size:12px;margin-top:2px}
  .tag{display:inline-block;background:#eef1f6;border-radius:6px;padding:1px 7px;font-size:11px;color:#4b5563;margin-right:5px}
  .lv{font-weight:800;margin-right:6px}.lv3{color:#dc2626}.lv2{color:#d97706}.lv1{color:#059669}
  .gb{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 9px;margin-right:6px;letter-spacing:.02em}
  .title{font-weight:800;font-size:15px;margin-top:5px;line-height:1.35;color:#111827}
  .detail{color:#4b5563;font-size:12px;margin-top:3px;line-height:1.5}
  .meta2{color:#475467;font-size:12px;margin-top:5px;font-weight:600}
  .date{align-self:flex-start}
  .btns{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
  .btns a{text-decoration:none;font-size:13px;font-weight:700;padding:9px 12px;border-radius:9px;white-space:nowrap}
  .apply{background:var(--accent);color:#fff}
  .cal{background:#eef1f6;color:#374151;border:1px solid var(--line)}
  .status{display:flex;gap:4px;flex:1 1 100%;margin-top:2px}
  .status button{flex:0 0 auto;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#f7f8fa;color:#667085;cursor:pointer}
  .status button.on-go{background:#16a34a;color:#fff;border-color:#16a34a}
  .status button.on-maybe{background:#d97706;color:#fff;border-color:#d97706}
  .status button.on-done{background:#98a2b3;color:#fff;border-color:#98a2b3}
  .note{color:var(--sub);font-size:12px;margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fff}
  /* ===== 検索まわり（2026/8/6 追加） ===== */
  .searchbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .searchbar input[type=search]{flex:1;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--txt);-webkit-appearance:none}
  .searchbar input[type=search]:focus{outline:none;border-color:var(--accent)}
  .searchbar .clr{background:#eef1f6;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;cursor:pointer;white-space:nowrap;color:#374151}
  .frow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
  .frow .lb{font-size:11px;color:var(--sub);font-weight:700;margin-right:2px;flex:0 0 auto}
  .frow button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
  .frow.ar button.on{background:#0891b2;border-color:#0891b2;color:#fff;font-weight:700}
  .frow.fe button.on{background:#db2777;border-color:#db2777;color:#fff;font-weight:700}
  .frow.ft button.on{background:#ea580c;border-color:#ea580c;color:#fff;font-weight:700}
  .frow.so button.on{background:#475569;border-color:#475569;color:#fff;font-weight:700}
  /* スクロールしたらタイトル行を畳んで、検索と絞り込みだけ残す */
  header.mini h1,header.mini .sub{display:none}
  header.mini{padding-top:8px}
  .hitbar{font-size:12px;color:var(--sub);margin:2px 0 6px;font-weight:600}
  .hitbar b{color:var(--accent);font-size:14px}
  mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
  .detail{max-height:3.1em;overflow:hidden;position:relative;cursor:pointer}
  .card.open .detail{max-height:none}
  .more{font-size:11px;color:var(--accent);font-weight:700;cursor:pointer;margin-top:2px}
  details.adv{margin-bottom:6px}
  details.adv summary{font-size:12px;color:var(--sub);cursor:pointer;font-weight:700;padding:2px 0;list-style:none}
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary:before{content:'▸ ';}
  details.adv[open] summary:before{content:'▾ ';}
  /* 狭い画面ではチップを1行の横スクロールにして、ヘッダーが画面を占有しないようにする */
  @media(max-width:720px){
    .frow{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
    .frow::-webkit-scrollbar{display:none}
    .frow button,.frow .lb,.frow input{flex:0 0 auto}
  }
  @media(max-width:560px){.btns{flex:1 1 100%}.btns a{flex:1;text-align:center}
    header{padding:10px 12px 6px}.searchbar input[type=search]{font-size:16px;padding:9px 11px}
    h1{font-size:16px;margin-bottom:2px}.sub{font-size:11px;margin-bottom:6px}
    .frow{gap:5px;margin-bottom:5px}.frow button{padding:5px 9px}
    .hitbar{margin:0 0 4px}}
</style>

function ymdPlus(dstr,add){const t=new Date(dstr+'T00:00:00');t.setDate(t.getDate()+(add||0));
  return ''+t.getFullYear()+String(t.getMonth()+1).padStart(2,'0')+String(t.getDate()).padStart(2,'0');}
function gcal(ev){
  const hhmm=(ev.t||'').match(/\d{1,2}:\d{2}/g)||[];
  const multiDay=ev.endd&&ev.endd!==ev.d;
  let dates;
  if(hhmm.length&&!multiDay){
    const pad=function(x){const p=x.split(':');return String(p[0]).padStart(2,'0')+p[1];};
    const st=pad(hhmm[0]);
    const en=hhmm.length>1?pad(hhmm[1]):String(Math.min(+hhmm[0].split(':')[0]+2,23)).padStart(2,'0')+hhmm[0].split(':')[1];
    /* 終了が開始以前なら日をまたぐ扱い */
    const endDay=(en<=st)?ymdPlus(ev.d,1):ymdPlus(ev.d,0);
    dates=ymdPlus(ev.d,0)+'T'+st+'00/'+endDay+'T'+en+'00';
  }else{
    /* 終日予定。Googleカレンダーの終日は終了日を+1する仕様 */
    dates=ymdPlus(ev.d,0)+'/'+ymdPlus(ev.endd||ev.d,1);
  }
  const p=new URLSearchParams({action:'TEMPLATE',text:ev.n,dates:dates,
    details:(ev.t&&!/^[—\-]$/.test(ev.t)?'時間: '+ev.t+'\n':'')+'申込/詳細: '+ev.u,location:ev.a||''});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}

/* ===== 日付フィルタ ===== */
let dateMode='すべて',activeDate='';
const DMODES=['すべて','今日','明日','今週末','今後7日'];
function ymd(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function onDay(e,day){return e.d<=day&&(e.endd||e.d)>=day;}
function inRange(e,from,to){return e.d<=to&&(e.endd||e.d)>=from;}
function datePass(e){
  if(dateMode==='すべて')return true;
  var t=new Date();t.setHours(0,0,0,0);
  if(dateMode==='今日')return onDay(e,ymd(t));
  if(dateMode==='明日'){var d=new Date(t);d.setDate(d.getDate()+1);return onDay(e,ymd(d));}
  if(dateMode==='今週末'){
    var dow=t.getDay();
    if(dow===0)return onDay(e,ymd(t));                       /* 今日が日曜なら今日のみ */
    var sat=new Date(t);sat.setDate(sat.getDate()+((6-dow)+7)%7); /* 直近の土曜(今日が土なら今日) */
    var sun=new Date(sat);sun.setDate(sun.getDate()+1);
    return inRange(e,ymd(sat),ymd(sun));
  }
  if(dateMode==='今後7日'){var e7=new Date(t);e7.setDate(e7.getDate()+6);return inRange(e,ymd(t),ymd(e7));}
  if(dateMode==='日付指定'&&activeDate)return onDay(e,activeDate);
  return true;
}
function chips(elId,items,cur,onpick,label){
  var c=document.getElementById(elId);if(!c)return;c.innerHTML='';
  if(label){var l=document.createElement('span');l.className='lb';l.textContent=label;c.appendChild(l);}
  items.forEach(function(name){var b=document.createElement('button');b.textContent=name;
    if(name===cur)b.className='on';b.onclick=function(){onpick(name);};c.appendChild(b);});
}
function render(){
  /* エリア・特徴・料金・並び順（2026/8/6 追加） */
  chips('arfilters',AREAS.map(function(a){return a[0];}),activeArea,function(v){activeArea=v;render();},'エリア');
  chips('ftfilters',FEATS.map(function(a){return a[0];}),activeFeat,function(v){activeFeat=v;render();},'特徴');
  chips('fefilters',FEES.map(function(a){return a[0];}),activeFee,function(v){activeFee=v;render();},'料金');
  chips('sofilters',['日付順','おすすめ順'],sortMode,function(v){sortMode=v;render();},'並び順');
  const fc=document.getElementById('filters');fc.innerHTML='';
  var _cl=document.createElement('span');_cl.className='lb';_cl.textContent='ジャンル';fc.appendChild(_cl);
  ['すべて'].concat(CATS).forEach(function(c){var b=document.createElement('button');b.textContent=c;if(c===activeCat)b.className='on';b.onclick=function(){activeCat=c;render();};fc.appendChild(b);});
  const sf=document.getElementById('stfilters');sf.innerHTML='';
  Object.keys(STF).forEach(function(c){var b=document.createElement('button');b.textContent=c;if(c===activeSt)b.className='on';b.onclick=function(){activeSt=c;render();};sf.appendChild(b);});
  var ft=document.createElement('button');ft.textContent=(hideFounder?'☑ ':'☐ ')+'⚠️起業寄りを隠す';if(hideFounder)ft.className='on';ft.onclick=function(){hideFounder=!hideFounder;render();};sf.appendChild(ft);
  /* ===== 日付フィルタUI ===== */
  const df=document.getElementById('dtfilters');df.innerHTML='';
  DMODES.forEach(function(m){var b=document.createElement('button');b.textContent=m;if(dateMode===m)b.className='on';b.onclick=function(){dateMode=m;activeDate='';render();};df.appendChild(b);});
  var inp=document.createElement('input');inp.type='date';inp.value=activeDate;inp.className='dtin';if(dateMode==='日付指定')inp.classList.add('on');
  inp.onchange=function(){activeDate=this.value;dateMode=this.value?'日付指定':'すべて';render();};
  df.appendChild(inp);
  if(dateMode==='日付指定'&&activeDate){var cl=document.createElement('button');cl.textContent='×  解除';cl.onclick=function(){activeDate='';dateMode='すべて';render();};df.appendChild(cl);}
  const list=document.getElementById('list');list.innerHTML='';
  var _shown=0;
  dated.slice().sort(function(a,b){
    if(sortMode==='おすすめ順'){var dl=(b.l||0)-(a.l||0);if(dl)return dl;}
    return a.d>b.d?1:a.d<b.d?-1:0;
  }).filter(function(e){var _t=new Date();_t.setHours(0,0,0,0);return (activeCat==='すべて'||e.c===activeCat)&&pass(e.n)&&(!hideFounder||!isFounder(e))&&datePass(e)&&allPass(e)&&new Date((e.endd||e.d)+'T23:59:59')>=_t;}).forEach(function(e){
    _shown++;
    var lvtxt=e.l===3?'◎◎':e.l===2?'◎':'○';var nm=splitName(e);
    var card=document.createElement('div');card.className='card l'+e.l+' '+stClass(e.n);if(isFounder(e))card.style.opacity='0.68';
    card.innerHTML='<div class="date">'+dlabel(e)+'<small>'+(e.t||'終日')+'</small></div>'+
      '<div class="main"><div>'+gbadge(e)+'<span class="lv lv'+e.l+'">'+lvtxt+'</span></div>'+
      '<div class="title">'+hl(nm[0])+fwb(e)+'</div>'+
      (nm[1]?'<div class="detail" onclick="this.parentNode.parentNode.classList.toggle(\'open\')">'+hl(nm[1])+'</div><div class="more" onclick="this.parentNode.parentNode.classList.toggle(\'open\')">▼ 詳細を開く/閉じる</div>':'')+
      '<div class="meta2">📍'+hl(e.a)+'　💴'+hl(e.f)+'</div></div>'+
      '<div class="btns"><a class="apply" href="'+e.u+'" target="_blank">申込</a><a class="cal" href="'+gcal(e)+'" target="_blank">📅追加</a></div>'+
      stBtns(e.n);
    list.appendChild(card);
  });
  /* 見出しに絞り込み結果の件数を表示 */
  var _dh=document.getElementById('datedHead');
  if(_dh){
    var _lbl=(dateMode==='すべて')?'📅 日付が決まっているもの（早い順）'
      :(dateMode==='日付指定'?'📅 '+activeDate+' に参加できるもの':'📅 '+dateMode+'に参加できるもの');
    _dh.innerHTML=_lbl+' <span style="font-weight:400;color:var(--sub);font-size:12px">— '+_shown+'件</span>'+
      (_shown===0?'<div style="font-weight:400;color:var(--sub);font-size:12px;margin-top:6px">条件に合うイベントがありません。日付や絞り込みを変えてみてください。</div>':'');
  }
  const rc=document.getElementById('recurring');rc.innerHTML='';
  var _rshown=0;
  recurring.filter(function(e){return (activeCat==='すべて'||e.c===activeCat)&&pass(e.n)&&(!hideFounder||!isFounder(e))&&allPass(e);}).forEach(function(e){
    _rshown++;
    var lvtxt=e.l===3?'◎◎':e.l===2?'◎':'○';var nm=splitName(e);
    var card=document.createElement('div');card.className='card l'+e.l+' '+stClass(e.n);if(isFounder(e))card.style.opacity='0.68';
    card.innerHTML='<div class="main"><div>'+gbadge(e)+'<span class="lv lv'+e.l+'">'+lvtxt+'</span></div>'+
      '<div class="title">'+hl(nm[0])+fwb(e)+'</div>'+
      (nm[1]?'<div class="detail" onclick="this.parentNode.parentNode.classList.toggle(\'open\')">'+hl(nm[1])+'</div><div class="more" onclick="this.parentNode.parentNode.classList.toggle(\'open\')">▼ 詳細を開く/閉じる</div>':'')+
      '<div class="meta2">📍'+hl(e.a)+'　💴'+hl(e.f)+'</div></div>'+
      '<div class="btns"><a class="apply" href="'+e.u+'" target="_blank">詳細/参加</a></div>'+stBtns(e.n);
    rc.appendChild(card);
  });
  /* 件数バー＋有効な絞り込みの表示 */
  var hb=document.getElementById('hitbar');
  if(hb){
    var act=[];
    if(qText)act.push('🔍「'+qText+'」');
    if(activeArea!=='すべて')act.push(activeArea);
    if(activeFeat!=='すべて')act.push(activeFeat);
    if(activeFee!=='すべて')act.push(activeFee);
    if(activeCat!=='すべて')act.push(activeCat);
    if(dateMode!=='すべて')act.push(dateMode==='日付指定'?activeDate:dateMode);
    if(activeSt!=='すべて')act.push(activeSt);
    hb.innerHTML='該当 <b>'+_shown+'</b> 件（日付あり）＋ <b>'+_rshown+'</b> 件（定期）'+
      (act.length?'　｜　絞り込み中: '+act.join(' / '):'　｜　全'+dated.length+'件から検索できます');
  }
}
var gc=document.getElementById('give');
give.forEach(function(e){var lvtxt=e.l===3?'◎◎':e.l===2?'◎':'○';var nm=splitName(e);var card=document.createElement('div');card.className='card l'+e.l;card.innerHTML='<div class="main"><div><span class="gb" style="background:#0369a1;color:#fff">🤲 与える</span><span class="lv lv'+e.l+'">'+lvtxt+'</span></div><div class="title">'+nm[0]+'</div>'+(nm[1]?'<div class="detail">'+nm[1]+'</div>':'')+'<div class="meta2">💴'+e.f+'</div></div><div class="btns"><a class="apply" href="'+e.u+'" target="_blank">始める</a></div>';gc.appendChild(card);});
/* ===== 検索ボックスの配線（2026/8/6 追加） ===== */
(function(){
  var qi=document.getElementById('q');
  if(qi){
    var tid=null;
    qi.addEventListener('input',function(){
      clearTimeout(tid);var v=this.value;
      tid=setTimeout(function(){qText=norm(v).trim();render();},150);
    });
    /* ページ内どこでも「/」で検索窓へ */
    document.addEventListener('keydown',function(ev){
      if(ev.key==='/'&&document.activeElement!==qi){ev.preventDefault();qi.focus();qi.select();}
      if(ev.key==='Escape'&&document.activeElement===qi){qi.value='';qText='';render();qi.blur();}
    });
  }
  var cb=document.getElementById('clrAll');
  if(cb)cb.onclick=clearAll;
  /* スクロールでヘッダーを縮める（検索欄・絞り込みは常に触れる） */
  var hd=document.querySelector('header');
  if(hd){
    var onScroll=function(){hd.classList.toggle('mini',window.scrollY>70);};
    window.addEventListener('scroll',onScroll,{passive:true});
    onScroll();
  }
})();
render();
</script>
